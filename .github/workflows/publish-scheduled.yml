name: 排程發布

on:
  schedule:
    # cron 一律 UTC。0 0 * * * = 台北時間早上八點。每天跑而不是只跑週一／週四，
    # 是為了讓臨時插隊的文章不必等到下一個發布窗口。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只印今天到期的清單，不寫檔也不 push
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 官方 action 追大版本 tag 的理由見 seo-pr.yml 檔頭，不在這裡重複。
      #
      # fetch-depth: 2 是為了最後一步的 IndexNow 提交——它要 `git show HEAD~1:<file>` 取
      # 翻牌前的 frontmatter。depth 1 其實也行得通（HEAD~1 正是這一步 checkout 出來、
      # blob 完整在本機的那顆 commit），但那要靠 shallow clone 的實作細節成立；明寫 2 把
      # 「讀得到父節點的檔案」變成顯式保證，多抓一顆 commit 的成本可忽略。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 安裝依賴
        run: npm ci

      # 這一步刻意沒有 continue-on-error：腳本會在 frontmatter 壞掉或「判為到期卻改不動」
      # 時 exit 1，那正是需要人介入的情況，吞掉的話那篇會每天被判到期又每天沒動。
      - name: 翻牌到期的排程文章
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run publish:scheduled
          else
            node scripts/publish-scheduled.mjs --apply
          fi

      - name: 檢查有沒有實際變更
        id: changes
        run: |
          # 限定 src/content/posts：翻牌只改這個目錄，若不限定路徑，工作區裡任何
          # 其他變動都會讓 changed=true，接著 git add src/content/posts 卻什麼都
          # 沒 stage，commit 會以「nothing to commit」失敗，失敗原因與排程發布無關。
          if git diff --quiet -- src/content/posts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "今天沒有要發的文章"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/content/posts
          fi

      # 必須是完整的 npm run build 而不是 astro build：subset-fonts 對草稿直接 skip，
      # 所以排程稿的標題與分類從來沒進過字型子集。翻牌後若含新字元，OG 圖會 tofu 而
      # astro build 照樣綠（hardware 分類那次踩過同一個坑）。
      - name: 建置
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: 靜態 SEO 驗證
        if: steps.changes.outputs.changed == 'true'
        run: npm run verify:seo

      # 驗證全綠才 push。失敗時工作區的改動隨 runner 消失，那篇文章維持 draft 留在 repo
      # 裡，隔天 cron 會再試一次，同時 GitHub 上有一筆紅燈可查。
      - name: Commit 並 push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/content/posts
          git commit -m "chore(publish): 排程發布到期文章"
          git push

      # 必須在這裡呼叫，不能靠 indexnow.yml 的 push 事件接力：Actions 以預設 GITHUB_TOKEN
      # push 出去的 commit 不會觸發其他 workflow（GitHub 的防遞迴設計），只接 push 事件的話
      # 排程文章永遠送不出去。
      #
      # 這一步會等 Cloudflare Pages 把剛 push 的內容部署完成，花上幾分鐘是正常的。
      - name: 送出 IndexNow
        id: indexnow
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/submit-indexnow.mjs --base HEAD~1

      - name: 寫入 Job Summary
        if: always()
        run: |
          # 失敗時（build 或 verify:seo 紅燈）steps.changes.outputs.changed 仍可能是
          # true，但沒有 push——只看 changed 會印出「有文章發布」這種沒發生的事，
          # 人唯一會看的就是這塊摘要，講錯話等於這條檢查白裝。job.status 優先判斷。
          #
          # 「送出 IndexNow」只排在 Commit 並 push 之後，且沒有 continue-on-error，
          # 所以它的 outcome 會是 failure 時，前面的 commit 與 push 必定已經成功——
          # 文章其實上線了，壞的只是索引通知。這個分支得排在 job.status 判斷之前，
          # 否則會被籠統地併進「失敗，未 push」，講的話跟實際發生的事相反。
          {
            echo "## 排程發布"
            echo "- 觸發：${{ github.event_name }}"
            echo "- 模式：${{ inputs.dry_run == true && 'dry-run' || 'apply' }}"
            if [ "${{ steps.indexnow.outcome }}" = "failure" ]; then
              echo "- 結果：文章已發布並 push 成功，但 IndexNow 索引通知送出失敗，需重跑補送"
            elif [ "${{ job.status }}" != "success" ]; then
              echo "- 結果：失敗，未 push"
            elif [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
              echo "- 結果：有文章發布"
            else
              echo "- 結果：今天沒有到期文章"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
