name: SEO 生產環境日檢

on:
  schedule:
    # cron 一律是 UTC。19:00 UTC = 台北時間（UTC+8）隔日 03:00，挑深夜離峰時段，
    # 避免稽核爬蟲流量與白天真人讀者的流量、快取觀察互相干擾。
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  daily-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # 放在 squirrelscan 之前：標頭被 zone 層規則覆寫是「靜默失效」——build 綠燈、
      # 部署成功、_headers 檔案也沒錯，只有實際回應的標頭被換掉。這種漂移沒有人
      # 盯著就不會被發現，所以讓它直接讓日檢失敗。continue-on-error 是為了讓後面的
      # squirrelscan 仍然照跑，不要因為標頭問題就失去當天的完整稽核紀錄。
      - name: 驗證正式站回應標頭與 _headers 意圖一致
        id: headers
        continue-on-error: true
        run: node scripts/verify-headers.mjs https://frankchen.tw

      - name: 對正式站執行 squirrelscan 稽核
        # 版本鎖定而非 npx squirrelscan（取 latest）：squirrelscan 還在 0.0.x，
        # 語意化版號在 1.0 前不保證相容，CLI 參數與計分都可能無預警變動。日檢是
        # 用來看「站台狀態隨時間的變化」的，工具版本跟著飄就分不出分數變化是站台
        # 退步還是換了把尺。要升版請開獨立 PR，對照前後報告再合併。
        env:
          SQUIRRELSCAN_VERSION: 0.0.79
        run: |
          # --offline：只關閉雲端功能（雲端渲染／報告發佈／額度檢查），本地審計本體
          # （SEO / Performance / Security / Agents 四項分數）完全不受影響，因此就算
          # 這台 runner 沒設定 squirrelscan 雲端帳號或 API key，稽核依然會正常完成。
          # -y：跳過互動式確認提示——CI 環境沒有 TTY 可以回應 prompt。
          npx --yes "squirrelscan@${SQUIRRELSCAN_VERSION}" audit https://frankchen.tw \
            --max-pages 60 \
            --offline \
            -y \
            -f markdown \
            -o squirrelscan-report.md

      - name: 寫入 Job Summary
        run: cat squirrelscan-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 上傳報告 artifact
        uses: actions/upload-artifact@v4
        with:
          name: squirrelscan-report-${{ github.run_id }}
          path: squirrelscan-report.md
          retention-days: 30

      - name: 標頭檢查失敗時讓整個 job 失敗
        if: steps.headers.outcome == 'failure'
        run: |
          echo "::error::正式站回應標頭與 public/_headers 的意圖不一致，見上方 verify-headers 輸出。"
          echo "### 標頭檢查未通過" >> "$GITHUB_STEP_SUMMARY"
          echo "正式站實際回傳的標頭與 \`public/_headers\` 不一致。" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages 的設定若在 \`*.pages.dev\` 上正確、在正式網域上卻不正確，" >> "$GITHUB_STEP_SUMMARY"
          echo "問題在 zone 層：Cloudflare Dashboard → Rules → Transform Rules →" >> "$GITHUB_STEP_SUMMARY"
          echo "Modify Response Header，以及 Rules → Managed Transforms。" >> "$GITHUB_STEP_SUMMARY"
          exit 1
