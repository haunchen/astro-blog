name: SEO PR 稽核

# 分支不限：任何 PR 都可能動到 SEO 相關檔案（layout、頁面、sitemap 設定等），
# 不值得用 branches filter 排除，讓漏網的改動有機會逃過檢查。
on:
  pull_request:

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      # 官方 action 一律追大版本 tag（@v7 而非 @v7.0.1）：這與下方 Lighthouse／
      # squirrelscan 的版本鎖定不衝突，兩者管的是不同東西——那兩支是「尺」，版本一飄
      # 分數就不可比；這幾支只是把程式碼拉下來、裝好 Node、傳個檔案，沒有跨時間比較
      # 的產出，跟著大版本吃安全修補才是對的。
      #
      # v4 → v7 的升級（2026-08-07）：起因是 runner 開始警告 v4 系列鎖在 Node 20、
      # 已被強制改跑 Node 24。四個大版本的 breaking change 都逐一對照過本 repo，
      # 全部不適用，記在這裡免得下次升版又查一輪：
      #   - checkout v6 把 persist-credentials 從 git config 改存 $RUNNER_TEMP：
      #     本檔與 seo-daily.yml 都沒有 checkout 之後再跑 git 的步驟。
      #   - checkout v7 擋掉 pull_request_target／workflow_run 底下 checkout fork PR：
      #     本檔的觸發器是 pull_request（見檔頭），拿的是 PR 的 merge commit，不是
      #     那條規則管的路徑。要注意的是這條與觸發器綁定——哪天把上面改成
      #     pull_request_target（例如為了讓 fork PR 拿得到 secrets），這條就會生效。
      #   - setup-node v5／v6 會依 package.json 的 packageManager 欄位自動開快取：
      #     本專案沒有那個欄位，而且下面已經明確寫 cache: 'npm'，不受自動偵測影響。
      #   - upload-artifact v7 新增 archive 參數（見 seo-daily.yml）：可選，沒用到。
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 安裝依賴
        run: npm ci

      # 併進這支 workflow 而非另開一條：測試只跑幾百毫秒，單獨開一個 job 要多付一次
      # checkout + setup-node + npm ci 的固定成本，遠比測試本身貴。放在建置之前是為了
      # fail fast——工具鏈壞掉時不必等完整 build 與 Lighthouse 跑完才看到紅燈。
      - name: 單元測試（WP 遷移工具鏈）
        run: npm test

      - name: 建置
        run: npm run build

      - name: 靜態 SEO 驗證（meta / JSON-LD / sitemap / 孤兒頁）
        run: npm run verify:seo

      - name: 啟動 preview server（背景執行）
        run: |
          # nohup + disown：避免這個 step 的 shell 結束時把 preview server 一併 SIGHUP 掉，
          # 讓它能撐到後面 Lighthouse 那幾個 step 使用。
          nohup npm run preview > preview.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4321/ > /dev/null; then
              echo "preview server 已就緒"
              exit 0
            fi
            sleep 1
          done
          echo "::error::preview server 30 秒內未就緒"
          cat preview.log
          exit 1

      - name: 決定要稽核的文章頁 URL
        id: sample
        run: |
          # 不寫死特定 slug：文章會增減，寫死遲早對到已下架或改名的文章。
          # 直接從 build 產出的 sitemap 挑第一篇「非列表頁」當代表樣本。
          ARTICLE_PATH=$(node -e "
            const fs = require('fs');
            const xml = fs.readFileSync('dist/sitemap.xml', 'utf8');
            const locs = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1]);
            const skip = new Set(['/', '/articles/', '/about/', '/n8n-resources/', '/contact-frank/', '/privacy-policy/', '/category/', '/tag/']);
            const article = locs
              .map((loc) => new URL(loc).pathname)
              .find((p) => !skip.has(p) && !p.startsWith('/category/') && !p.startsWith('/tag/'));
            if (!article) { console.error('sitemap 內找不到可用的文章頁'); process.exit(1); }
            process.stdout.write(article);
          ")
          echo "找到樣本文章頁：$ARTICLE_PATH"
          echo "path=$ARTICLE_PATH" >> "$GITHUB_OUTPUT"

      - name: 執行 Lighthouse 稽核（首頁 / 文章列表 / 關於我 / 一篇文章頁）
        # 版本鎖定而非 npx lighthouse（取 latest）：Lighthouse 每個大版本都會調整
        # 稽核項目與計分權重，同一份程式碼在不同版本下分數可以差好幾分。若放任
        # 取 latest，某天上游一發版就會有一批與該 PR 內容完全無關的紅燈，而且
        # 分數的跨時間比較也失去意義。要升版請開一支獨立 PR，把分數變化看清楚。
        # 不放進 devDependencies 是因為 Lighthouse 會連帶拖進 Chromium 相關依賴，
        # 只有 CI 這一步用得到，沒必要讓每次 npm ci 與本機開發都付這個成本。
        env:
          LIGHTHOUSE_VERSION: 13.4.1
        run: |
          mkdir -p lighthouse-reports
          run_lh() {
            npx --yes "lighthouse@${LIGHTHOUSE_VERSION}" "$1" \
              --output=json --output-path="$2" \
              --chrome-flags="--headless --no-sandbox" --quiet
          }
          run_lh "http://localhost:4321/" lighthouse-reports/home.json
          run_lh "http://localhost:4321/articles/" lighthouse-reports/articles.json
          run_lh "http://localhost:4321/about/" lighthouse-reports/about.json
          run_lh "http://localhost:4321${{ steps.sample.outputs.path }}" lighthouse-reports/article.json

      - name: 檢查分數門檻並寫入 Job Summary
        run: |
          cat <<'SCRIPT_EOF' > check-lighthouse-scores.mjs
          import { readFileSync, appendFileSync } from 'node:fs';

          const TARGETS = [
            { name: '首頁', file: 'lighthouse-reports/home.json' },
            { name: '文章列表', file: 'lighthouse-reports/articles.json' },
            { name: '關於我', file: 'lighthouse-reports/about.json' },
            // overrides：只有這頁掛廣告（spec monetization.md R2），Best Practices
            // 門檻依實測放寬，理由見下方 THRESHOLDS 上方註解。其餘三頁沒有第三方
            // cookie 的來源，不跟著鬆，繼續吃 THRESHOLDS 的預設值 100。
            { name: '文章頁樣本', file: 'lighthouse-reports/article.json', overrides: { 'best-practices': 75 } },
          ];

          // Performance 門檻刻意設低（85，非 90 也非 95）：GitHub Actions 共用 runner 的
          // CPU/IO 效能會隨當下負載波動，同一頁面在本機量測與 CI 上可能相差 5~10 分。
          // 設高在 CI 上會頻繁偽陽性擋下與效能無關的 PR，真正的效能回歸要靠數值下滑的
          // 趨勢觀察（每輪的分數表格都寫在本 job 的 Summary 裡），不是單次門檻卡死。
          //
          // 90 → 85 的實證（2026-08-03，PR #45）：同一份完全不觸及 src/、public/、
          // astro.config 的 diff（只動 scripts/ 與 docs/），兩輪 CI 各紅一次、分別是
          // 首頁 Performance 87 與 88，兩次重跑都過。也就是同一份建置產物在 runner 上
          // 至少有 87~90+ 的擺幅，門檻 90 剛好落在擺幅正中間，等於擲硬幣。
          //
          // 代價要知道：真的退化到 86 不會被擋下。這是刻意的取捨——單次門檻本來就
          // 攔不住那種程度的回歸（它落在雜訊裡），硬把門檻設在雜訊帶只會讓 CI 訊號
          // 失去可信度，紅燈變成「再跑一次就好」的例行動作，那才是真正危險的狀態。

          // Best Practices 門檻預設維持 100，只有「文章頁樣本」那個 target 用
          // TARGETS 上的 overrides 降到實測後的 75——首頁、文章列表、關於我依
          // spec R2（monetization.md）本來就不會出現廣告，沒有第三方 cookie 的
          // 來源，這三頁的 Best Practices 沒理由跟著鬆掉：日後若這三頁出現與
          // 廣告無關的回歸（例如某個共用元件在非文章頁誤觸發 console error），
          // 應該還是被 100 卡住，不該一路掉到 76 以下才被攔。
          //
          // 75 這個數字：文章頁掛了廣告後的已知失分項是 third-party-cookies——
          // Google 會種 doubleclick.net 的第三方 cookie，這條無解，除非不放
          // 廣告，是設計階段明確接受的取捨（docs/specs/monetization.md R9）。
          // 若這個數字再往下掉，才是真的壞了。
          //
          // 實測來源：2026-08-04 於本機以 Lighthouse 13.4.1 對同一篇文章頁量測
          // 兩次，皆為 77（兩次一致）。75 留了 2 分緩衝而非直接取 77，避免正常的
          // 量測擺幅（見上方 Performance 90→85 那次事故）誤觸紅燈。
          //
          // 掉破門檻時別急著結論成廣告回歸：先看 report 的 errors-in-console 與
          // image-* 兩類稽核項——本 job 抽的文章頁樣本取自 sitemap 第一篇「非列表
          // 頁」（見上一個 step 的取樣邏輯），每次 PR 不保證同一篇，新增一篇圖片
          // 沒處理好的文章也會讓這頁掉分，紅燈原因看起來卻像廣告回歸，其實與
          // AdSense 無關。
          //
          // 注意這裡量不到 CSP 的代價：public/_headers 為了 AdSense 在 script-src
          // 加了 'unsafe-inline'，但本 job 的 Lighthouse 跑在 astro preview 上，
          // 它不套用 _headers，CSP 標頭不在量測範圍內。那一項要用 PageSpeed
          // Insights 打正式站才看得到。
          const THRESHOLDS = {
            seo: 100,
            accessibility: 95,
            'best-practices': 100,
            performance: 85,
          };

          const LABELS = {
            seo: 'SEO',
            accessibility: 'Accessibility',
            'best-practices': 'Best Practices',
            performance: 'Performance',
          };

          let anyFailed = false;
          const rows = ['| 頁面 | SEO | Accessibility | Best Practices | Performance |', '|---|---|---|---|---|'];
          const failureLines = [];

          for (const { name, file, overrides = {} } of TARGETS) {
            const report = JSON.parse(readFileSync(file, 'utf8'));
            const categories = report.categories;
            const scores = Object.fromEntries(
              Object.keys(THRESHOLDS).map((key) => [key, Math.round((categories[key]?.score ?? 0) * 100)]),
            );

            rows.push(
              `| ${name} | ${scores.seo} | ${scores.accessibility} | ${scores['best-practices']} | ${scores.performance} |`,
            );

            // 一律印進 log，不只寫 Job Summary：Summary 只有網頁看得到，
            // `gh run view --log` 取不到，於是「成功那幾輪到底幾分」在 CLI 無從查起。
            // Performance 門檻已因 runner 擺幅降到 85，補償手段正是趨勢觀察，
            // 而趨勢要查得到才有用。前綴固定成 `LH-SCORE`，方便跨 run grep 出時間序列。
            console.log(
              `LH-SCORE ${name} seo=${scores.seo} a11y=${scores.accessibility} ` +
                `best-practices=${scores['best-practices']} performance=${scores.performance}`,
            );

            // overrides 只有「文章頁樣本」會帶（見上方 TARGETS），其餘三頁 overrides
            // 是空物件，effectiveMin 一律退回 THRESHOLDS 的共用值——seo/accessibility/
            // performance 三項因此仍是四頁共用門檻，沒有被這個機制複雜化。
            for (const [key, min] of Object.entries(THRESHOLDS)) {
              const effectiveMin = overrides[key] ?? min;
              if (scores[key] < effectiveMin) {
                anyFailed = true;
                failureLines.push(`${name}：${LABELS[key]} = ${scores[key]}（門檻 ${effectiveMin}）`);
              }
            }
          }

          // Best Practices 的門檻說明要單獨組字串：文章頁樣本吃 overrides、其餘三頁吃
          // THRESHOLDS 預設，兩者不同，寫死一個數字會讓看報表的人誤以為四頁同門檻。
          const bpOverrideNote = TARGETS.filter((t) => t.overrides?.['best-practices'] !== undefined)
            .map((t) => `${t.name} ${t.overrides['best-practices']}`)
            .join('、');
          const bpDesc = bpOverrideNote
            ? `${THRESHOLDS['best-practices']}（${bpOverrideNote}——只有掛廣告的頁面降門檻）`
            : `${THRESHOLDS['best-practices']}`;

          const summary = [
            '## Lighthouse SEO 稽核結果',
            '',
            ...rows,
            '',
            `門檻：SEO ${THRESHOLDS.seo} / Accessibility ≥${THRESHOLDS.accessibility} / Best Practices ${bpDesc} / Performance ≥${THRESHOLDS.performance}`,
            '',
          ];

          if (failureLines.length > 0) {
            summary.push('### 未達標項目', '', ...failureLines.map((line) => `- ${line}`), '');
          }

          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');

          if (anyFailed) {
            console.error('Lighthouse 分數未達門檻：');
            failureLines.forEach((line) => console.error(`  - ${line}`));
            process.exit(1);
          }

          console.log('Lighthouse 分數全數達標。');
          SCRIPT_EOF
          node check-lighthouse-scores.mjs

      # 內容協商活在 Pages Functions 裡，前面那些步驟一個都碰不到它：astro preview 不執行
      # Functions，verify:seo 只看 dist 的靜態產物。沒有這一步，協商壞掉要等部署到正式站
      # 才會被發現——而它壞掉的方式是靜默退回 HTML，站台看起來完全正常。
      - name: 啟動 wrangler pages dev（背景執行）
        run: |
          nohup npm run preview:pages > wrangler.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8788/ > /dev/null; then
              echo "wrangler pages dev 已就緒"
              exit 0
            fi
            sleep 1
          done
          echo "::error::wrangler pages dev 60 秒內未就緒"
          cat wrangler.log
          exit 1

      - name: 驗證 Accept 內容協商
        run: npm run verify:negotiation http://localhost:8788
